# 楼梯与台阶（tools/gen_content.py、tools/gen_steps.py 生成，勿手改）。
blocks:
  botania:black_pavement_slab:
    behavior:
      type: slab_block
    states:
      properties:
        type:
          type: slab_type
          default: bottom
        waterlogged:
          type: boolean
          default: false
      appearances:
        'type=bottom,waterlogged=false':
          state: "minecraft:oxidized_cut_copper_slab[type=bottom,waterlogged=false]"
          model: botania:block/empty
          transparent: true
          entity_renderer:
            type: item_display
            item: botania:render/black_pavement_slab
            display_transform: none
            rotation: [0, 1.00000000, 0, 0]
        'type=bottom,waterlogged=true':
          state: "minecraft:oxidized_cut_copper_slab[type=bottom,waterlogged=true]"
          model: botania:block/empty
          transparent: true
          entity_renderer:
            type: item_display
            item: botania:render/black_pavement_slab
            display_transform: none
            rotation: [0, 1.00000000, 0, 0]
        'type=double,waterlogged=false':
          state: "minecraft:oxidized_cut_copper_slab[type=double,waterlogged=false]"
          model: botania:block/empty
          transparent: true
          entity_renderer:
            type: item_display
            item: botania:render/steps/black_pavement_slab/black_pavement
            display_transform: none
            rotation: [0, 1.00000000, 0, 0]
        'type=double,waterlogged=true':
          state: "minecraft:oxidized_cut_copper_slab[type=double,waterlogged=true]"
          model: botania:block/empty
          transparent: true
          entity_renderer:
            type: item_display
            item: botania:render/steps/black_pavement_slab/black_pavement
            display_transform: none
            rotation: [0, 1.00000000, 0, 0]
        'type=top,waterlogged=false':
          state: "minecraft:oxidized_cut_copper_slab[type=top,waterlogged=false]"
          model: botania:block/empty
          transparent: true
          entity_renderer:
            type: item_display
            item: botania:render/steps/black_pavement_slab/black_pavement_slab_top
            display_transform: none
            rotation: [0, 1.00000000, 0, 0]
        'type=top,waterlogged=true':
          state: "minecraft:oxidized_cut_copper_slab[type=top,waterlogged=true]"
          model: botania:block/empty
          transparent: true
          entity_renderer:
            type: item_display
            item: botania:render/steps/black_pavement_slab/black_pavement_slab_top
            display_transform: none
            rotation: [0, 1.00000000, 0, 0]
      variants:
        'type=bottom,waterlogged=false':
          appearance: 'type=bottom,waterlogged=false'
        'type=bottom,waterlogged=true':
          appearance: 'type=bottom,waterlogged=true'
          settings:
            fluid_state: water
        'type=double,waterlogged=false':
          appearance: 'type=double,waterlogged=false'
        'type=double,waterlogged=true':
          appearance: 'type=double,waterlogged=true'
          settings:
            fluid_state: water
        'type=top,waterlogged=false':
          appearance: 'type=top,waterlogged=false'
        'type=top,waterlogged=true':
          appearance: 'type=top,waterlogged=true'
          settings:
            fluid_state: water
    settings:
      sounds:
        break: minecraft:block.stone.break
        step: minecraft:block.stone.step
        place: minecraft:block.stone.place
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
      hardness: 1.5
      resistance: 6.0
      require_correct_tools: true
      correct_tools:
        - '#minecraft:pickaxes'
      tags:
        - minecraft:mineable/pickaxe
        - minecraft:needs_stone_tool
        - minecraft:slabs
      item: botania:black_pavement_slab
    loot:
      pools:
        - rolls: 1
          entries:
            - type: item
              item: botania:black_pavement_slab
              functions:
                - type: set_count
                  count: 2
                  add: false
                  conditions:
                    - type: match_block_property
                      properties:
                        type: double
                - type: explosion_decay
