# 方块（tools/gen_content.py 生成，勿手改）。
# 整块方块走 solid + 方块模型；小模型方块走透明载体 + 实体渲染
# （用音符盒当载体的话，客户端会按整块剔除它下方方块的顶面）。
blocks:
  botania:abstruse_platform:
    state:
      auto_state: solid
      model: botania:block/abstruse_platform
    settings:
      sounds:
        break: minecraft:block.stone.break
        step: minecraft:block.stone.step
        place: minecraft:block.stone.place
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
      hardness: 1.5
      resistance: 3.0
      require_correct_tools: false
      item: botania:abstruse_platform
    loot:
      pools:
        - rolls: 1
          entries:
            - type: item
              item: botania:abstruse_platform
