# 核心玩法方块（tools/gen_core_blocks.py 生成，改脚本重跑，勿手改）。
# 载体规则见脚本头部注释：优先透明满块（玻璃），不够的退回音符盒。

blocks:
  botania:mana_pool:
    behavior:
      type: botania:mana_pool
    state:
      state: "minecraft:oak_leaves[distance=6,persistent=true,waterlogged=false]"
      model: botania:block/empty
      transparent: true
      entity_culling: false
    settings:
      sounds:
        break: minecraft:block.stone.break
        step: minecraft:block.stone.step
        place: minecraft:block.stone.place
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
      hardness: 2.0
      resistance: 10.0
      can_occlude: false
      is_suffocating: false
      is_view_blocking: false
      fluid_state: false
      friction: 0.6
      item: botania:mana_pool
    loot:
      pools:
        - rolls: 1
          entries:
            - type: item
              item: botania:mana_pool
  botania:mana_spreader:
    behavior:
      type: botania:mana_spreader
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        north:
          state: "minecraft:oak_leaves[distance=5,persistent=true,waterlogged=false]"
          model: botania:block/empty
          transparent: true
          entity_culling: false
          entity_renderer:
            type: item_display
            item: botania:render/mana_spreader
            display_transform: none
            rotation: '0,180,0'
        east:
          state: "minecraft:oak_leaves[distance=4,persistent=true,waterlogged=false]"
          model: botania:block/empty
          transparent: true
          entity_culling: false
          entity_renderer:
