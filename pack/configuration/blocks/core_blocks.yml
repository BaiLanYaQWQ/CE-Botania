          transparent: true
          entity_culling: false
          entity_renderer:
            type: item_display
            item: botania:render/mana_spreader
            display_transform: none
            rotation: '0,0,0'
        west:
          state: "minecraft:oak_leaves[distance=2,persistent=true,waterlogged=false]"
          model: botania:block/empty
          transparent: true
          entity_culling: false
          entity_renderer:
            type: item_display
            item: botania:render/mana_spreader
            display_transform: none
            rotation: '0,270,0'
      variants:
        'facing=north':
          appearance: north
        'facing=east':
          appearance: east
        'facing=south':
          appearance: south
        'facing=west':
          appearance: west
    settings:
      sounds:
        break: minecraft:block.stone.break
        step: minecraft:block.stone.step
        place: minecraft:block.stone.place
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
      hardness: 1.5
      resistance: 6.0
      can_occlude: false
      is_suffocating: false
      is_view_blocking: false
      fluid_state: false
      friction: 0.6
      item: botania:mana_spreader
    loot:
