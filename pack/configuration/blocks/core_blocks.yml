# 核心玩法方块（tools/gen_core_blocks.py 生成，改脚本重跑，勿手改）。
# 载体规则见脚本头部注释：优先透明满块（玻璃），不够的退回音符盒。

blocks:
  botania:mana_pool:
    behavior:
      type: botania:mana_pool
    states:
      properties:
        filled:
          type: boolean
          default: false
      appearances:
        empty:
          state: "minecraft:glass"
          model: botania:block/mana_pool
        full:
          state: "minecraft:tinted_glass"
          model: botania:block/mana_pool_full
      variants:
        'filled=false':
          appearance: empty
        'filled=true':
          appearance: full
    settings:
      sounds:
        break: minecraft:block.stone.break
        step: minecraft:block.stone.step
        place: minecraft:block.stone.place
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
      hardness: 1.5
      resistance: 6.0
      can_occlude: false
      is_suffocating: false
      is_view_blocking: false
      fluid_state: false
      friction: 0.6
      item: botania:mana_pool
    loot:
      pools:
        - rolls: 1
          entries:
            - type: item
              item: botania:mana_pool
  botania:mana_spreader:
    behavior:
      type: botania:mana_spreader
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        north:
          state: "minecraft:white_stained_glass"
          model: botania:block/mana_spreader
        east:
          state: "minecraft:orange_stained_glass"
          model:
            path: botania:block/mana_spreader
            y: 90
        south:
          state: "minecraft:magenta_stained_glass"
          model:
            path: botania:block/mana_spreader
            y: 180
        west:
          state: "minecraft:light_blue_stained_glass"
          model:
            path: botania:block/mana_spreader
            y: 270
      variants:
        'facing=north':
          appearance: north
        'facing=east':
          appearance: east
        'facing=south':
          appearance: south
        'facing=west':
          appearance: west
    settings:
      sounds:
        break: minecraft:block.stone.break
        step: minecraft:block.stone.step
        place: minecraft:block.stone.place
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
      hardness: 1.5
      resistance: 6.0
      can_occlude: false
      is_suffocating: false
      is_view_blocking: false
      fluid_state: false
      friction: 0.6
      item: botania:mana_spreader
    loot:
      pools:
        - rolls: 1
          entries:
            - type: item
              item: botania:mana_spreader
